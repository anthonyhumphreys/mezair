name: Hosted Sync production backend

on:
  workflow_dispatch:
    inputs:
      provider_evidence:
        description: "Reference to the reviewed live staging provider checks for this release"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: sync-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mezair-production
    defaults:
      run:
        working-directory: mezair-app/cloud/backend
    env:
      CI: true
      MEZAIR_DEPLOYMENT_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            mezair-app/cloud/backend/pnpm-lock.yaml
            mezair-cloud/pnpm-lock.yaml
      - name: Check protected production inputs
        env:
          MEZAIR_PRODUCTION_WORKER_VARS_JSON: ${{ vars.MEZAIR_PRODUCTION_WORKER_VARS_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          HOSTED_SERVICE_KEYS: ${{ secrets.HOSTED_SERVICE_KEYS }}
          HOSTED_OPERATOR_KEYS: ${{ secrets.HOSTED_OPERATOR_KEYS }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_WEBHOOK_SECRET: ${{ secrets.WORKOS_WEBHOOK_SECRET }}
          CLOUDFLARE_TUNNEL_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_ZONE_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ZONE_ID }}
          CLOUDFLARE_TUNNEL_API_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_API_TOKEN }}
          STAGING_SECRET_FINGERPRINTS_JSON: ${{ vars.STAGING_SECRET_FINGERPRINTS_JSON }}
        run: node scripts/hosted-ci-config.mjs production
      - name: Install backend and deployment CLI dependencies
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm --dir ../../../mezair-cloud install --frozen-lockfile
      - name: Verify backend and deployment guards
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:hosted-deploy
          node scripts/verify-hosted-config.mjs --self-check
      - name: Build deployment CLI
        working-directory: mezair-cloud
        run: pnpm build
      - name: Prepare isolated production configuration
        env:
          MEZAIR_PRODUCTION_WORKER_VARS_JSON: ${{ vars.MEZAIR_PRODUCTION_WORKER_VARS_JSON }}
          HOSTED_SERVICE_KEYS: ${{ secrets.HOSTED_SERVICE_KEYS }}
          HOSTED_OPERATOR_KEYS: ${{ secrets.HOSTED_OPERATOR_KEYS }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_WEBHOOK_SECRET: ${{ secrets.WORKOS_WEBHOOK_SECRET }}
          CLOUDFLARE_TUNNEL_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_ZONE_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ZONE_ID }}
          CLOUDFLARE_TUNNEL_API_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_API_TOKEN }}
          STAGING_SECRET_FINGERPRINTS_JSON: ${{ vars.STAGING_SECRET_FINGERPRINTS_JSON }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { validateManifest, validateBackendSecrets, assertProductionSecretsAreFresh } from './scripts/hosted-deploy.mjs';
          import { hostedCiSecrets, hostedCiVars } from './scripts/hosted-ci-config.mjs';
          const manifest = JSON.parse(readFileSync('hosted-targets.example.json', 'utf8'));
          const target = validateManifest(manifest, 'production');
          const vars = hostedCiVars('production', process.env, target);
          const secrets = hostedCiSecrets(process.env);
          validateBackendSecrets(secrets, target, 'production', {
            managedEndpointsEnabled: vars.MEZAIR_MESH_MANAGED_ENDPOINTS === 'true',
          });
          const stagingFingerprints = JSON.parse(process.env.STAGING_SECRET_FINGERPRINTS_JSON || '{}');
          manifest.stagingSecretFingerprintsFile = '.wrangler/staging-secret-fingerprints.json';
          for (const [path, data] of [
            [target.secrets.backendFile, secrets],
            [manifest.stagingSecretFingerprintsFile, stagingFingerprints],
            ['.wrangler/hosted-targets.json', manifest],
          ]) {
            mkdirSync(dirname(path), { recursive: true, mode: 0o700 });
            writeFileSync(path, JSON.stringify(data), { mode: 0o600 });
          }
          assertProductionSecretsAreFresh(manifest, secrets);
          const directory = `.wrangler/mesh/${target.workerName}`;
          mkdirSync(directory, { recursive: true });
          writeFileSync(`${directory}/vars.json`, JSON.stringify(vars), { mode: 0o600 });
          writeFileSync(`${directory}/wrangler.jsonc`, JSON.stringify({
            name: target.workerName,
            account_id: target.accountId,
            d1_databases: [{ binding: 'HOSTED_DB', database_name: target.databaseName, database_id: target.databaseId }],
          }), { mode: 0o600 });
          JS
          pnpm hosted:deploy -- --environment production plan --json
      - name: Validate, migrate, deploy and install production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          PROVIDER_EVIDENCE: ${{ inputs.provider_evidence }}
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'Missing CLOUDFLARE_DEPLOY_API_TOKEN'; exit 1; }
          pnpm hosted:deploy -- --environment production apply --dry-run --json
          pnpm hosted:deploy -- --environment production migrate --json
          pnpm hosted:deploy -- --environment production apply --evidence "$PROVIDER_EVIDENCE" --json
          pnpm hosted:deploy -- --environment production secrets --json
      - name: Verify production descriptor and secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          pnpm exec wrangler secret list --format json --config .wrangler/mesh/mezair-sync-hosted-production/wrangler.jsonc > .wrangler/production-secret-names.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const target = JSON.parse(readFileSync('.wrangler/hosted-targets.json', 'utf8')).environments.production;
          const vars = JSON.parse(readFileSync(`.wrangler/mesh/${target.workerName}/vars.json`, 'utf8'));
          const names = new Set(JSON.parse(readFileSync('.wrangler/production-secret-names.json', 'utf8')).map(secret => secret.name));
          const required = ['HOSTED_SERVICE_KEYS', 'WORKOS_API_KEY', 'WORKOS_WEBHOOK_SECRET'];
          if (vars.MEZAIR_MESH_MANAGED_ENDPOINTS === 'true') required.push(
            'CLOUDFLARE_TUNNEL_ACCOUNT_ID', 'CLOUDFLARE_TUNNEL_ZONE_ID', 'CLOUDFLARE_TUNNEL_API_TOKEN',
          );
          for (const name of required) {
            if (!names.has(name)) throw new Error(`Missing installed secret: ${name}`);
          }
          const response = await fetch(`${target.baseUrl}/.well-known/mezair-backend`);
          if (!response.ok) throw new Error(`Production descriptor returned ${response.status}`);
          const descriptor = await response.json();
          if (descriptor.descriptorVersion !== 1 ||
              !descriptor.protocols?.includes('mezair-backend/1') ||
              !descriptor.profiles?.includes('sync/2') ||
              !descriptor.profiles?.includes('mesh/2') ||
              descriptor.deploymentId !== target.deploymentId ||
              descriptor.auth?.publicClientId !== target.workos.desktopClientId ||
              !descriptor.authModes?.includes('workos-device') ||
              descriptor.authModes?.includes('enrollment-code')) {
            throw new Error('Production descriptor identity does not match the selected target');
          }
          console.log('Verified isolated production identity and installed secret names.');
          JS
      - name: Record production deployment
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const vars = JSON.parse(readFileSync('.wrangler/mesh/mezair-sync-hosted-production/vars.json', 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Backend candidate: \`${process.env.GITHUB_SHA}\`\n\nCheckout and Cloud Agents remain disabled. Managed endpoints: \`${vars.MEZAIR_MESH_MANAGED_ENDPOINTS}\`. Physical-device acceptance remains separate.\n`);
          JS

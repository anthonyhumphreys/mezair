<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mezair Desktop — The stable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:oklch(0.135 0.03 266);
  --text:oklch(0.965 0.006 250);
  --muted:oklch(0.77 0.02 255);
  --rule:oklch(0.3 0.03 262);
  --accent:oklch(0.76 0.17 54);
  --ink:oklch(0.16 0.03 266);
  --w:1180px;
}
*{box-sizing:border-box}
html,body{margin:0;width:1440px;height:900px;overflow:hidden}
body{background:var(--ground);color:var(--text);font-family:"Archivo",system-ui,sans-serif;font-variation-settings:"wdth" 100;-webkit-font-smoothing:antialiased;position:relative}
a{color:inherit;text-decoration:none}
.wide{font-variation-settings:"wdth" 116}

/* header */
header{position:relative;z-index:2;width:var(--w);margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between}
.mark{font-size:22px;font-weight:760;letter-spacing:-0.02em}
nav{display:flex;align-items:center;gap:32px;font-size:15px;color:var(--muted)}
nav a:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--ink);font-weight:640;border-radius:8px}
.btn-sm{height:36px;padding:0 16px;font-size:14px}

/* title card */
.title{position:relative;z-index:2;text-align:center;padding-top:18px}
h1{margin:0;font-size:78px;font-weight:740;letter-spacing:-0.03em;line-height:0.95;font-variation-settings:"wdth" 116}
.lede{margin:18px 0 0;font-size:19px;line-height:1.4;color:var(--muted)}
.ctas{margin-top:22px;display:flex;justify-content:center;align-items:center;gap:28px}
.btn-lg{height:48px;padding:0 26px;font-size:16px}
.link{font-size:16px;font-weight:540;color:var(--text);border-bottom:1px solid var(--rule);padding-bottom:3px}

/* light behind the stable */
.light{position:absolute;z-index:0;left:50%;top:360px;width:1500px;height:900px;transform:translateX(-50%);
  background:radial-gradient(closest-side,oklch(0.36 0.08 262 / 0.42),oklch(0.36 0.08 262 / 0.12) 55%,transparent)}

/* the stable: lintel of four stalls, then the doorway */
.stable{position:absolute;z-index:1;left:50%;top:384px;width:var(--w);transform:translateX(-50%)}
.stalls{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--ground)}
.stall{padding:20px 28px 22px;border-left:1px solid var(--rule)}
.stall:first-child{border-left:0;padding-left:4px}
.stall b{display:block;font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;font-variation-settings:"wdth" 116;color:var(--text)}
.stall span{display:block;margin-top:7px;font-size:14px;color:var(--muted)}
.window{margin-top:-1px;border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:var(--ground);
  box-shadow:0 40px 80px -20px oklch(0.06 0.02 266 / 0.9),0 90px 160px -40px oklch(0.05 0.02 266 / 0.85)}
.window img{display:block;width:100%;height:auto}
</style>
</head>
